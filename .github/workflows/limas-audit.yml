name: LIMAS Audit

permissions:
  contents: read
  issues: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: E2E data invariant audit
        run: npm run audit

      - name: Runtime isolation audit
        run: npm run audit:runtime

      - name: Runtime data quality audit
        id: dq
        continue-on-error: true
        run: node scripts/audit-dq-runtime.mjs > dq-runtime-output.txt 2>&1; rc=$?; cat dq-runtime-output.txt; exit $rc

      - name: Publish DQ diagnostics to PR
        if: steps.dq.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('dq-runtime-output.txt','utf8');
            const body = ['### LIMAS DQ diagnostic','', '~~~text', raw.slice(-18000), '~~~'].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail on DQ gate
        if: steps.dq.outcome == 'failure'
        run: exit 1
