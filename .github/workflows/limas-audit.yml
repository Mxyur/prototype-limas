name: LIMAS Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: E2E data invariant audit
        run: npm run audit

      - name: Runtime isolation audit
        run: npm run audit:runtime

      - name: Runtime data quality audit
        id: dq
        continue-on-error: true
        run: node scripts/audit-dq-runtime.mjs > dq-runtime-output.txt 2>&1; rc=$?; cat dq-runtime-output.txt; exit $rc

      - name: Persist DQ diagnostic via Contents API
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('dq-runtime-output.txt','utf8');
            const path = '.ci/dq-runtime-output.txt';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.pull_request.head.ref;
            let sha = undefined;
            try {
              const existing = await github.rest.repos.getContent({owner,repo,path,ref:branch});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
              if (sha && Buffer.from(existing.data.content,'base64').toString('utf8') === raw) return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const content = Buffer.from(raw,'utf8').toString('base64');
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: 'chore: capture LIMAS DQ diagnostic',
              content,
              sha
            });

      - name: Fail on DQ gate
        if: steps.dq.outcome == 'failure'
        run: exit 1
