name: LIMAS Audit

permissions:
  contents: write
  issues: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: E2E data invariant audit
        run: npm run audit

      - name: Runtime isolation audit
        run: npm run audit:runtime

      - name: Runtime data quality audit
        id: dq
        continue-on-error: true
        run: node scripts/audit-dq-runtime.mjs > dq-runtime-output.txt 2>&1; rc=$?; cat dq-runtime-output.txt; exit $rc

      - name: Publish DQ diagnostics to PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('dq-runtime-output.txt','utf8');
            const body = ['### LIMAS DQ diagnostic','', '~~~text', raw.slice(-20000), '~~~'].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Persist DQ diagnostic to branch
        if: always()
        shell: bash
        run: |
          mkdir -p .ci
          cp dq-runtime-output.txt .ci/dq-runtime-output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/dq-runtime-output.txt
          git commit -m "chore: capture LIMAS DQ diagnostic" || true
          git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
      - name: Fail on DQ gate
        if: steps.dq.outcome == 'failure'
        run: exit 1
