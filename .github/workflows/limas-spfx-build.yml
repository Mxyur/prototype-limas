name: LIMAS SPFx Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - "spfx/**"
      - ".github/workflows/limas-spfx-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spfx
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spfx/package.json

      - name: Install dependencies
        run: npm install

      - name: Build SPFx package
        run: npm run build

      - name: Upload SPFx package
        uses: actions/upload-artifact@v4
        with:
          name: limas-spfx-package
          path: spfx/sharepoint/solution/limas-spfx.sppkg
